server.port=${SERVER_PORT:8080}
spring.application.name=taquilla-cine-api

# Conexión JDBC configurable. No hay credenciales ni valores sensibles embebidos.
# Para PostgreSQL remoto con SSL agregue los parámetros al final de DB_URL, por
# ejemplo: jdbc:postgresql://host:5432/base?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taquilla_cine_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema es administrado por taquilla-cine-db. La aplicación nunca crea ni
# modifica tablas automáticamente.
spring.sql.init.mode=never

# Orígenes autorizados para CORS, separados por coma. El valor predeterminado es
# el servidor de desarrollo de Angular 21. No se usa "*" por defecto.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator: solo health y sin detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# El manejo de errores es propio (GlobalExceptionHandler); estas opciones evitan
# que el endpoint /error agregue mensajes o trazas adicionales.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
